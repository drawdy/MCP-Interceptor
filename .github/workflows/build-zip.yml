name: Build And Upload Extension Zip Via Artifact

on:
  push:
    branches: [ main, dev ]
    paths:
      - '.example.env'
      - '.npmrc'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - 'bash-scripts/**'
      - 'chrome-extension/**'
      - 'pages/**'
      - 'packages/**'
      - '!docs/**'
      - '!**/*.md'
  pull_request:
    branches: [ main, dev ]
    paths:
      - '.example.env'
      - '.npmrc'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - 'bash-scripts/**'
      - 'chrome-extension/**'
      - 'pages/**'
      - 'packages/**'
      - '!docs/**'
      - '!**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline --network-concurrency=4 --fetch-retries=5
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          path: dist/*
