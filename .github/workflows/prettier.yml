name: Formatting validation

on:
  pull_request:
    branches: [main, dev]
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.mts'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.json'
      - '.prettierrc'
      - '.prettierignore'
      - '.github/workflows/prettier.yml'
  push:
    branches: [main, dev]
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.mts'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.json'
      - '.prettierrc'
      - '.prettierignore'
      - '.github/workflows/prettier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formatting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check formatting of changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi

          patterns=('*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.mts' '*.json')
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || \
            ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- .prettierrc .prettierignore; then
            mapfile -d '' -t files < <(git ls-files -z -- "${patterns[@]}")
          else
            mapfile -d '' -t files < <(
              git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- "${patterns[@]}"
            )
          fi

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed JavaScript, TypeScript, or JSON files to format-check."
            exit 0
          fi

          printf 'Checking %s changed file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          npx --yes prettier@3.9.10 --check "${files[@]}"
